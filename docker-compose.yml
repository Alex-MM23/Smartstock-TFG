version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartstock_db
    restart: always
    environment:
      MYSQL_DATABASE: smartstock
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: smartstock
      MYSQL_PASSWORD: smartstock_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: smartstock_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=smartstock
      - DB_PASSWORD=smartstock_pass
      - DB_NAME=smartstock
      - SECRET_KEY=${SECRET_KEY:-super-secret-change-in-production-min-32-chars}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front-app
      dockerfile: Dockerfile
    container_name: smartstock_front
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data: