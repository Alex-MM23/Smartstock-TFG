version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartstock_db
    restart: always
    environment:
      MYSQL_DATABASE: smartstock
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: smartstock_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - SERVICE_LEVEL_Z=${SERVICE_LEVEL_Z:-1.645}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Back/artifacts:/app/artifacts

  frontend:
    build:
      context: ./front-app
      dockerfile: Dockerfile.prod
    container_name: smartstock_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data: